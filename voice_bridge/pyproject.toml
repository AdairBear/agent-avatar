[project]
name = "voice-bridge"
version = "0.1.0"
description = "Self-hosted xiaozhi-protocol voice bridge: ESP32 mic -> local Whisper -> paste or Claude"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
voice-bridge = "voice_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_bridge"]
